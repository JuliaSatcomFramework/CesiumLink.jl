<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CesiumLink — recording player</title>
  <link rel="stylesheet" href="player.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; }
    #app { position: absolute; inset: 0; }
    /* Shown only while the recording is fetched, and while a failure needs naming. A page that
       stays black is indistinguishable from a viewer that never received anything. */
    #status {
      position: absolute; inset: 0; display: grid; place-items: center; z-index: 10;
      font: 14px/1.5 system-ui, sans-serif; color: #ddd; background: #000; padding: 2rem;
      text-align: center;
    }
    #status[hidden] { display: none; }
    #status.failed { color: #ff9d9d; }
  </style>
  <script>window.CESIUM_BASE_URL = "cesium/";</script>
</head>
<body>
  <div id="app"></div>
  <div id="status">loading the recording…</div>
  <script type="module" src="player.js"></script>
</body>
</html>
