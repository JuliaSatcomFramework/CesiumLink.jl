name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Viewer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure must not cancel the others: the point of the matrix is to see which
      # platforms pass, and a cancelled run reports nothing about them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lib/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  julia:
    name: Julia (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lib/package-lock.json
      # Build the viewer first. The suite asks `viewer_dist()` for the tree it serves, and that
      # function prefers `lib/dist`. Without this step it falls back to the release artifact, and
      # the tests then measure a build other than this one.
      #
      # Two steps rather than one `&&`: the Windows runner reads a `run:` block with PowerShell.
      - run: npm ci
        working-directory: lib
      - run: npm run build
        working-directory: lib
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-runtest@v1
