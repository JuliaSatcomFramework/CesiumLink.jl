name: CI

# Prose only, and ignored rather than listed, so a new source directory is covered the day it
# appears. Both jobs are in scope: the Julia suite builds `lib/dist` and serves it, and it reads
# `extension/fixtures/discovery.json`, so no path outside documentation is safe to skip for it.
#
# Markdown is named at the root and below it, rather than by one `**.md`, whose reading is not the
# same in every matcher. A pattern that misses a file costs a run that had nothing to do, and a job
# is never skipped by one.
#
# The list is written twice because a filter belongs to one trigger and not to the workflow, and
# because the Actions parser does not read a YAML anchor.
#
# Nothing reports a status on an ignored event, so this must be revisited if `main` ever takes a
# required status check: a documentation pull request would then wait for a check that never runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - LICENSE
      - NOTICE
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - LICENSE
      - NOTICE

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Viewer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure must not cancel the others: the point of the matrix is to see which
      # platforms pass, and a cancelled run reports nothing about them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lib/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  julia:
    name: Julia (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lib/package-lock.json
      # Build the viewer first. The suite asks `viewer_dist()` for the tree it serves, and that
      # function prefers `lib/dist`. Without this step it falls back to the release artifact, and
      # the tests then measure a build other than this one.
      #
      # Two steps rather than one `&&`: the Windows runner reads a `run:` block with PowerShell.
      - run: npm ci
        working-directory: lib
      - run: npm run build
        working-directory: lib
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-runtest@v1
      # `src` alone: `tools/` and `examples/` carry Julia the package does not ship, and counting
      # them would report the package as far less covered than it is.
      #
      # Linux and Windows both upload, and Codecov merges the two. `src/server.jl` splits on
      # `Sys.iswindows()`, so neither run alone reaches every line. macOS takes the same branches as
      # Linux, and a third upload of those lines says nothing more than the first.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os != 'macos-latest'
        with:
          directories: src
      - uses: codecov/codecov-action@v5
        if: matrix.os != 'macos-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
