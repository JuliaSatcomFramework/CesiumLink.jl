name: Docs

# The build runs every example and starts a server for each one, so it takes minutes rather than
# seconds. It runs on every push to `main` all the same: a site that only a human remembers to
# deploy is a site that describes the state before last.
#
# No `paths` filter narrowing that to the pushes that can change a page. A path filter applies to
# every ref the trigger names, and a tag push carries no file diff for one to read, so adding a
# filter risks dropping the deploy that matters most and saying nothing about it. A build that had
# nothing to do costs runner time and deploys the same pages again.
#
# A burst of pushes costs two builds and not one per push: the concurrency group below holds one
# run and one waiting behind it, and GitHub drops the waiting run when a newer one arrives.
#
# A pull request builds the site and deploys it to `previews/PR<n>/`. Two things come of that.
# `makedocs` is the only thing that reads a `@ref` in a docstring, so a link to a name nobody
# documented is found here rather than after the merge, on `main`, where it stops the deploy. And a
# reviewer reads the page a change makes, and not the Markdown that makes it.
on:
  push:
    branches: [main]
    # A package version tag, and nothing else that starts with the letter v. `v*` also matches
    # `viewer-v0.1.1`, the tag of a viewer artifact release, which has no reason to rebuild the site.
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:

# Two deploys must not run at the same time. `deploydocs(; forcepush = true)` amends and force-pushes
# `gh-pages`, so a second run pushing over the first loses whichever snapshot lands second. Queue
# them instead of cancelling: a cancelled run may stop in the middle of that push.
#
# A pull request is one of those runs: `push_preview` in `docs/make.jl` puts its site at
# `previews/PR<n>/`, which amends and force-pushes the same branch. So every run this workflow starts
# shares the one group, and this workflow is the only thing that writes `gh-pages`.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      # The prune step asks whether a pull request is still open.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lib/package-lock.json
      # The viewer goes into the site whole, and every live player on a page loads it. Without this
      # step the build stays green and every player is blank.
      - run: npm ci
        working-directory: lib
      - run: npm run build
        working-directory: lib
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      # `docs/make.jl` develops the local packages and instantiates its own environment, so it needs
      # no Pkg call before it. Vitepress runs from Node of its own, which `DocumenterVitepress`
      # carries.
      - run: julia --project=docs --color=yes docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub Pages runs Jekyll on a branch whose root carries no `.nojekyll` marker, and Jekyll
      # rewrites every `.md` file it finds into `.html`. The viewer ships the two Cesium licence
      # files as Markdown, so they then answer 404 at the path the built tree puts them, which is
      # the path `NOTICE` promises. Documenter writes no such marker, and one inside `dev/` does not
      # count: Pages reads the root alone. This step writes nothing when the marker is already
      # there, and it stands after the deploy, which is what creates the branch.
      # Not for a pull request. Pages reads the marker at the root alone, and a preview sits under
      # `previews/`, so the marker a deploy from `main` maintains already covers one. The token a run
      # from a fork carries could not write it in any case.
      - name: Keep Jekyll off the published site
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/contents/.nojekyll?ref=gh-pages" >/dev/null 2>&1; then
            echo "the marker is already on gh-pages"
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/.nojekyll" \
              -f message="Keep Jekyll off the published site" \
              -f branch=gh-pages -f content=""
          fi

      # A preview belongs to an open pull request, and nothing else on `gh-pages` ever removes one:
      # `deploydocs` keeps `previews` when it clears the branch, which is what lets a preview outlive
      # the deploys that follow it. Each preview is a whole site carrying the built viewer and about
      # 1.2 MB of recordings, so a directory per merged branch is the branch growing without limit.
      #
      # The prune runs here, in the job that deploys, and not in a workflow that a pull request
      # closing starts. Two workflows that both force-push this branch race: a deploy that read the
      # branch before the other one pushed puts back the preview that other one removed, minutes
      # later. One writer cannot race itself. This also repairs itself, because every deploy prunes
      # again, so a run that fails costs a delay rather than a preview that stays for good.
      - name: Read the published branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages
      - name: Remove the preview of every closed pull request
        if: github.event_name != 'pull_request'
        working-directory: .gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stale=()
          for dir in previews/PR*; do
            [ -d "$dir" ] || continue
            number=${dir#previews/PR}
            state=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)
            case "$state" in
              # No answer names no state. Keep the preview: a preview that outstays its pull request
              # costs disk, and one removed under a pull request still open costs a reviewer the page.
              OPEN|"") echo "keeping $dir (state \"${state:-no answer}\")" ;;
              *) stale+=("$dir") ;;
            esac
          done
          if [ ${#stale[@]} -eq 0 ]; then
            echo "every preview belongs to an open pull request"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rqf -- "${stale[@]}"
          git commit -qm "Remove the preview of every closed pull request"
          # One commit, as `deploydocs(; forcepush = true)` leaves it. Committing the tree on its own
          # is what drops the removed sites from the history as well as from the branch — a removal
          # that only added a commit would keep every byte of them in what a clone fetches.
          git push -q --force origin $(git commit-tree HEAD^{tree} -m "Documentation"):gh-pages
          echo "removed: ${stale[*]}"
