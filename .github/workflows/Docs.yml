name: Docs

# The build runs every example and starts a server for each one, so it takes minutes rather than
# seconds. It runs on every push to `main` all the same: a site that only a human remembers to
# deploy is a site that describes the state before last.
#
# No `paths` filter narrowing that to the pushes that can change a page. A path filter applies to
# every ref the trigger names, and a tag push carries no file diff for one to read, so adding a
# filter risks dropping the deploy that matters most and saying nothing about it. A build that had
# nothing to do costs runner time and deploys the same pages again.
#
# A burst of pushes costs two builds and not one per push: the concurrency group below holds one
# run and one waiting behind it, and GitHub drops the waiting run when a newer one arrives.
#
# A pull request builds the site and deploys nothing. `makedocs` is the only thing that reads a
# `@ref` in a docstring, so a link to a name nobody documented is found here or after the merge, on
# `main`, where it stops the deploy.
on:
  push:
    branches: [main]
    # A package version tag, and nothing else that starts with the letter v. `v*` also matches
    # `viewer-v0.1.1`, the tag of a viewer artifact release, which has no reason to rebuild the site.
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:

# Two deploys must not run at the same time. `deploydocs(; forcepush = true)` amends and force-pushes
# `gh-pages`, so a second run pushing over the first loses whichever snapshot lands second. Queue
# them instead of cancelling: a cancelled run may stop in the middle of that push.
#
# A pull request build pushes nothing, so it needs none of that. It takes a group of its own per
# branch, where a new commit supersedes the build of the one before it.
#
# That holds only while `docs/make.jl` leaves `push_preview` unset. Turning it on makes a pull
# request amend and force-push `gh-pages` like any other deploy, and this group must go back to
# `docs` in the same change — a preview racing a deploy is the case the single group exists for.
# The site is already *built* under the base `previews/PR##`; it is the push alone that is off.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lib/package-lock.json
      # The viewer goes into the site whole, and every live player on a page loads it. Without this
      # step the build stays green and every player is blank.
      - run: npm ci
        working-directory: lib
      - run: npm run build
        working-directory: lib
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      # `docs/make.jl` develops the local packages and instantiates its own environment, so it needs
      # no Pkg call before it. Vitepress runs from Node of its own, which `DocumenterVitepress`
      # carries.
      - run: julia --project=docs --color=yes docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub Pages runs Jekyll on a branch whose root carries no `.nojekyll` marker, and Jekyll
      # rewrites every `.md` file it finds into `.html`. The viewer ships the two Cesium licence
      # files as Markdown, so they then answer 404 at the path the built tree puts them, which is
      # the path `NOTICE` promises. Documenter writes no such marker, and one inside `dev/` does not
      # count: Pages reads the root alone. This step writes nothing when the marker is already
      # there, and it stands after the deploy, which is what creates the branch.
      # A pull request deploys nothing, so there is no branch for this to write to, and the token a
      # run from a fork carries cannot write one.
      - name: Keep Jekyll off the published site
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/contents/.nojekyll?ref=gh-pages" >/dev/null 2>&1; then
            echo "the marker is already on gh-pages"
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/.nojekyll" \
              -f message="Keep Jekyll off the published site" \
              -f branch=gh-pages -f content=""
          fi
