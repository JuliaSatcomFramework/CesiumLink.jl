name: Doc Preview Cleanup

# Take a pull request's preview site off `gh-pages` when the pull request closes. Nothing else ever
# would: a deploy skips `previews` when it clears the branch, which is what lets a preview outlive
# the deploys that follow it, and what leaves it there for good once its pull request is gone.
#
# The weight is the reason to bother. Each preview is a whole site, and the site carries the built
# viewer and about 1.2 MB of recordings, so a directory per merged branch is the branch growing
# without limit.
on:
  pull_request:
    types: [closed]

# One group for each pull request, so no run of this workflow ever waits on another. The group
# `Docs.yml` uses looks right, because this force-pushes `gh-pages` as a deploy does. It loses
# cleanups: GitHub holds one pending run for a group and cancels the run it displaces, so two pull
# requests that close near each other leave a preview behind for good. The lease on the push below
# is what keeps this apart from a deploy instead.
concurrency:
  group: docs-cleanup-PR${{ github.event.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove the preview of this pull request
        env:
          PREVIEW_DIR: previews/PR${{ github.event.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin gh-pages
            git reset -q --hard FETCH_HEAD
            base=$(git rev-parse FETCH_HEAD)
            if [ ! -d "$PREVIEW_DIR" ]; then
              echo "no preview at $PREVIEW_DIR"
              exit 0
            fi
            git rm -rqf "$PREVIEW_DIR"
            git commit -qm "Remove the preview of pull request ${{ github.event.number }}"
            # One commit, as `deploydocs(; forcepush = true)` leaves it. Committing the tree on its
            # own is what drops the removed site from the history as well as from the branch — a
            # removal that only added a commit would keep every byte of it in what a clone fetches.
            squashed=$(git commit-tree HEAD^{tree} -m "Documentation")
            # A deploy that lands in the middle of this moves the branch, the lease then refuses the
            # push, and the next turn starts again from the snapshot that deploy left. Without the
            # lease the push would throw that deploy away.
            if git push -q --force-with-lease=gh-pages:$base origin $squashed:gh-pages; then
              exit 0
            fi
            echo "gh-pages moved during attempt $attempt, reading it again"
          done
          echo "gh-pages kept moving. The preview at $PREVIEW_DIR is still there." >&2
          exit 1
